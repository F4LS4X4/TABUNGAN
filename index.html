<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#ff6f91">
    <title>Kalender Keuangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>📋 Menu</h3>
            <button id="closeSidebarBtn" class="close-sidebar">&times;</button>
        </div>
        <div class="sidebar-menu">
            <button id="menuSavings" class="sidebar-btn">💰 Tabungan</button>
            <button id="menuCalculator" class="sidebar-btn">🧮 Kalkulator</button>
            <button id="menuNotes" class="sidebar-btn">📝 Catatan</button>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="container">
        <div class="app-header">
            <button id="hamburgerBtn" class="hamburger">☰</button>
            <h1>📅 Kalender Keuangan</h1>
        </div>

        <div id="toast" class="toast"></div>

        <div class="summary">
            <div class="summary-card cash-card">
                <h3>💵 Cash</h3>
                <div class="total-section">
                    <span class="label">Total:</span>
                    <span class="total-amount" id="cashTotal">Rp 0</span>
                </div>
            </div>
            <div class="summary-card saldo-card">
                <h3>🏦 Saldo</h3>
                <div class="total-section">
                    <span class="label">Total:</span>
                    <span class="total-amount" id="saldoTotal">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="total-saving-wrapper">
            <button id="totalSavingBtn" class="total-saving-btn">
                💰 Total Tabungan <span id="totalSavingAmount">Rp 0</span>
            </button>
        </div>

        <div class="today-info">
            <div class="today-badge">
                <span class="today-icon">📆</span>
                <span class="today-text" id="todayDateText"></span>
            </div>
        </div>

        <div class="calendar-controls">
            <button id="prevMonth" class="nav-btn">◀</button>
            <h2 id="monthYear"></h2>
            <button id="nextMonth" class="nav-btn">▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#ffe0e7;"></div><span>Belum ada transaksi</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#ffc0d0;"></div><span>Ada transaksi</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#fff0e6;border:2px solid #ff8c42;"></div><span>Hari Ini</span></div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>📜 Histori Transaksi</h2>
                <div class="history-stats" id="historyStats">Total: 0 transaksi</div>
            </div>
            <div class="history-controls">
                <div class="filter-buttons">
                    <button id="filterAll" class="filter-btn active">Semua</button>
                    <button id="filterCash" class="filter-btn">💵 Cash</button>
                    <button id="filterSaldo" class="filter-btn">🏦 Saldo</button>
                    <button id="filterIncome" class="filter-btn">📈 Pemasukan</button>
                    <button id="filterExpense" class="filter-btn">📉 Pengeluaran</button>
                    <button id="filterConvert" class="filter-btn">🔄 Konversi</button>
                </div>
                <div class="search-wrapper">
                    <input type="text" id="searchHistory" placeholder="🔍 Cari (tanggal, nominal, tipe, jenis)..." class="search-input">
                    <button id="clearSearch" class="clear-search">✖</button>
                </div>
            </div>
            <div class="history-table-container">
                <table class="history-table">
                    <thead>
                        <tr><th>Tanggal</th><th>Jenis</th><th>Tipe</th><th>Jumlah</th><th>Waktu</th></tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="5" style="text-align:center;">Belum ada transaksi</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modalDateTitle"></h3>
            <div class="form-group">
                <label>Jenis Uang</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="moneyType" value="cash" checked> 💵 Cash</label>
                    <label class="radio-label"><input type="radio" name="moneyType" value="saldo"> 🏦 Saldo</label>
                </div>
            </div>
            <div class="form-group">
                <label>Jenis Transaksi</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="transactionType" value="income" checked> 📈 Pemasukan</label>
                    <label class="radio-label"><input type="radio" name="transactionType" value="expense"> 📉 Pengeluaran</label>
                    <label class="radio-label"><input type="radio" name="transactionType" value="convert"> 🔄 Konversi</label>
                </div>
            </div>
            <div class="form-group" id="convertDirectionGroup" style="display:none;">
                <label>Arah Konversi</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="convertDirection" value="cashToSaldo" checked> 💵 Cash → 🏦 Saldo</label>
                    <label class="radio-label"><input type="radio" name="convertDirection" value="saldoToCash"> 🏦 Saldo → 💵 Cash</label>
                </div>
            </div>
            <div class="form-group">
                <label for="transactionAmount">Jumlah (Rp)</label>
                <input type="text" id="transactionAmount" placeholder="0" class="money-input" maxlength="15">
            </div>
            <button id="saveBtn" class="btn-primary">Simpan Transaksi</button>
        </div>
    </div>

    <div id="calculatorModal" class="modal">
        <div class="modal-content calculator-modal">
            <span class="close-calc close">&times;</span>
            <h3>🧮 Kalkulator</h3>
            <input type="text" id="calcDisplay" class="calc-display" readonly value="0">
            <div class="calc-buttons">
                <button class="calc-btn" data-val="7">7</button><button class="calc-btn" data-val="8">8</button><button class="calc-btn" data-val="9">9</button><button class="calc-btn operator" data-op="/">÷</button>
                <button class="calc-btn" data-val="4">4</button><button class="calc-btn" data-val="5">5</button><button class="calc-btn" data-val="6">6</button><button class="calc-btn operator" data-op="*">×</button>
                <button class="calc-btn" data-val="1">1</button><button class="calc-btn" data-val="2">2</button><button class="calc-btn" data-val="3">3</button><button class="calc-btn operator" data-op="-">−</button>
                <button class="calc-btn" data-val="0">0</button><button class="calc-btn" data-val="00">00</button><button class="calc-btn" data-val=".">.</button><button class="calc-btn operator" data-op="+">+</button>
                <button class="calc-btn clear" id="calcClear">C</button><button class="calc-btn equals" id="calcEqual">=</button>
            </div>
        </div>
    </div>

    <div id="notesModal" class="modal">
        <div class="modal-content notes-modal">
            <span class="close-notes close">&times;</span>
            <h3>📝 Catatan</h3>
            <div class="notes-input-group">
                <input type="text" id="noteInput" placeholder="Tulis catatan baru..." class="note-input">
                <button id="addNoteBtn" class="add-note-btn">Tambah</button>
            </div>
            <ul id="notesList" class="notes-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
