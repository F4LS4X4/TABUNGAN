<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <title>Kalender Keuangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Kalender Keuangan</h1>
        </header>

        <div id="toast" class="toast"></div>

        <div class="summary">
            <div class="summary-card cash-card">
                <h3>💵 Cash</h3>
                <div class="total-section">
                    <span class="label">Total:</span>
                    <span class="total-amount" id="cashTotal">Rp 0</span>
                </div>
            </div>
            <div class="summary-card saldo-card">
                <h3>🏦 Saldo</h3>
                <div class="total-section">
                    <span class="label">Total:</span>
                    <span class="total-amount" id="saldoTotal">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="today-info">
            <div class="today-badge">
                <span class="today-icon">📆</span>
                <span class="today-text" id="todayDateText"></span>
            </div>
        </div>

        <div class="calendar-controls">
            <button id="prevMonth" class="nav-btn">◀</button>
            <h2 id="monthYear"></h2>
            <button id="nextMonth" class="nav-btn">▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background:#e8f5e9;"></div><span>Belum ada transaksi</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#c8e6c9;"></div><span>Ada transaksi</span></div>
            <div class="legend-item"><div class="legend-color" style="background:#fff3e0;border:2px solid #ff9800;"></div><span>Hari Ini</span></div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>📜 Histori Transaksi</h2>
                <div class="history-stats" id="historyStats">Total: 0 transaksi</div>
            </div>
            <div class="history-controls">
                <div class="filter-buttons">
                    <button id="filterAll" class="filter-btn active">Semua</button>
                    <button id="filterCash" class="filter-btn">💵 Cash</button>
                    <button id="filterSaldo" class="filter-btn">🏦 Saldo</button>
                    <button id="filterIncome" class="filter-btn">📈 Pemasukan</button>
                    <button id="filterExpense" class="filter-btn">📉 Pengeluaran</button>
                    <button id="filterConvert" class="filter-btn">🔄 Konversi</button>
                </div>
                <div class="search-wrapper">
                    <input type="text" id="searchHistory" placeholder="🔍 Cari..." class="search-input">
                    <button id="clearSearch" class="clear-search">✖</button>
                </div>
            </div>
            <div class="history-table-container">
                <table class="history-table">
                    <thead><tr><th>Tanggal</th><th>Jenis</th><th>Tipe</th><th>Jumlah</th><th>Waktu</th></tr></thead>
                    <tbody id="historyBody"><tr><td colspan="5" style="text-align:center;">Belum ada transaksi</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modalDateTitle"></h3>
            <div class="form-group">
                <label>Jenis Uang</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="moneyType" value="cash" checked> 💵 Cash</label>
                    <label class="radio-label"><input type="radio" name="moneyType" value="saldo"> 🏦 Saldo</label>
                </div>
            </div>
            <div class="form-group">
                <label>Jenis Transaksi</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="transactionType" value="income" checked> 📈 Pemasukan</label>
                    <label class="radio-label"><input type="radio" name="transactionType" value="expense"> 📉 Pengeluaran</label>
                    <label class="radio-label"><input type="radio" name="transactionType" value="convert"> 🔄 Konversi</label>
                </div>
            </div>
            <div class="form-group" id="convertDirectionGroup" style="display:none;">
                <label>Arah Konversi</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="convertDirection" value="cashToSaldo" checked> 💵 Cash → 🏦 Saldo</label>
                    <label class="radio-label"><input type="radio" name="convertDirection" value="saldoToCash"> 🏦 Saldo → 💵 Cash</label>
                </div>
            </div>
            <div class="form-group">
                <label for="transactionAmount">Jumlah (Rp)</label>
                <input type="text" id="transactionAmount" placeholder="0" class="money-input">
            </div>
            <button id="saveBtn" class="btn-primary">Simpan</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
